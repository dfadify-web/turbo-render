<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reel</title>
<!-- fonts: always display=block + preload in REEL.init so no frame renders with a fallback face -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;height:100%;overflow:hidden}
  /* preview: fit the canvas to the window, any aspect ratio */
  canvas{display:block;position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="reel.js"></script>
<script src="reel-runtime.js"></script>
</body>
</html>
